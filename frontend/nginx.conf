# nginx reverse proxy for the simulation dashboard.
#
# WHY A PROXY:
#   The React app (port 80) calls ws://localhost:8001/ws and
#   http://localhost:8001/chaos/... directly in the browser.
#   When running in Docker Compose, "localhost" inside the browser
#   refers to the host machine — which works fine for local dev.
#
#   For a fully self-contained Docker deployment, these paths are
#   proxied through nginx so both the frontend and backend are
#   reachable from a single origin (no CORS needed, no port juggling).
#
#   /ws    → WebSocket upgrade to backend:8001
#   /chaos → REST chaos API to backend:8001
#   /      → Serve static React build (SPA fallback to index.html)

server {
    listen 80;
    server_name _;

    # Serve React SPA — all unknown paths fall back to index.html
    # so React Router handles client-side navigation.
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # WebSocket proxy — must set Upgrade and Connection headers.
    # The backend expects ws://backend:8001/ws inside the Docker network.
    location /ws {
        proxy_pass         http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;

        # WebSocket connections are long-lived — don't time them out.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # Chaos API proxy
    location /chaos/ {
        proxy_pass       http://backend:8001;
        proxy_set_header Host $host;
    }

    # Health / metrics REST endpoints
    location ~ ^/(health|ws/snapshot|ws/status|ws/history) {
        proxy_pass       http://backend:8001;
        proxy_set_header Host $host;
    }
}
